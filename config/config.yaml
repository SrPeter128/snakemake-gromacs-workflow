# Sample sheet with simulation specifications
sample_sheet: "config/samples.tsv"

# Cluster/HPC settings
cluster:
  # Walltime for individual jobs (important for long simulations on clusters)
  # Format: HH:MM:SS
  # Set this based on your cluster's max time limit
  walltime: "24:00:00"  # 24 hours per job
  
  # Number of cores per simulation
  cpus: 4
  
  # Memory per job (in GB)
  memory: 8
  
  # Queue/partition name (user should customize)
  queue: "default"
  
  # Email for job notifications (optional)
  email: ""

# Output and logging
output:
  # Keep intermediate files (large trajectory files)
  keep_trajectories: True
  
  # Compression level for output files
  compress_trajectories: True

# Analysis settings
analysis:
  # Extract energy for trajectory
  extract_energy: True
  
  # Calculate RMSD relative to first frame
  calculate_rmsd: True
  
  # Calculate radius of gyration
  calculate_rg: True

