$schema: "https://json-schema.org/draft/2020-12/schema"
description: entries for the sample sheet (MD simulations)
properties:
  sample:
    type: string
    description: sample name/identifier for the simulation
  sim_type:
    type: string
    enum: ["aa", "cg"]
    description: simulation type (all-atom or coarse-grain)
  force_field:
    type: string
    description: force field for this simulation (optional, overrides config default)
    default: null
  replicate:
    type: integer
    description: replicate number for multiple runs of same system
    default: 1
  prod_replicates:
    type: integer
    description: number of independent production runs with different seeds
    default: 1
    minimum: 1

required:
  - sample
  - sim_type

