$schema: "https://json-schema.org/draft/2020-12/schema"
description: main configuration schema for GROMACS MD workflow
properties:
  sample_sheet:
    type: string
    description: path to sample-sheet TSV file

  cluster:
    type: object
    properties:
      walltime:
        type: string
        description: maximum walltime per job (HH:MM:SS)
      cpus:
        type: number
        description: number of CPUs per job
        minimum: 1
      memory:
        type: number
        description: memory per job in GB
        minimum: 1
      queue:
        type: string
        description: queue or partition name
      email:
        type: string
        description: email for job notifications

  output:
    type: object
    properties:
      keep_trajectories:
        type: boolean
        description: keep intermediate trajectory files
      compress_trajectories:
        type: boolean
        description: compress output trajectory files

  analysis:
    type: object
    properties:
      extract_energy:
        type: boolean
      calculate_rmsd:
        type: boolean
      calculate_rg:
        type: boolean

required:
  - sample_sheet
  - cluster
