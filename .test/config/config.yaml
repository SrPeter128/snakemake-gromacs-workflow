# Test configuration for GROMACS workflow
sample_sheet: "config/samples.tsv"

# Simulation parameters
simulation:
  default_type: "aa"
  force_field: "amber14sb"
  temperature: 310
  pressure: 1.0
  nvt_time: 100
  npt_time: 100
  prod_time: 1000

# Cluster/HPC settings
cluster:
  walltime: "24:00:00"
  cpus: 4
  memory: 8
  queue: "default"
  email: ""

# Output settings
output:
  keep_trajectories: True
  compress_trajectories: False

# Analysis settings
analysis:
  extract_energy: True
  calculate_rmsd: True
  calculate_rg: True
