$schema: "https://json-schema.org/draft/2020-12/schema"
description: main configuration schema for GROMACS MD workflow
properties:
  sample_sheet:
    type: string
    description: path to sample-sheet TSV file

  simulation:
    type: object
    properties:
      default_type:
        type: string
        enum: ["aa", "cg"]
        description: default simulation type (all-atom or coarse-grain)
      force_field:
        type: string
        description: force field name (e.g., amber14sb, gromos54a7, martini)
      temperature:
        type: number
        description: temperature in Kelvin
        minimum: 0
      pressure:
        type: number
        description: pressure in Bar
        minimum: 0
      nvt_time:
        type: number
        description: NVT equilibration time in ps
      npt_time:
        type: number
        description: NPT equilibration time in ps
      prod_time:
        type: number
        description: production run time in ps
    required: ["default_type", "force_field", "temperature", "pressure"]

  cluster:
    type: object
    properties:
      walltime:
        type: string
        description: maximum walltime per job (HH:MM:SS)
      cpus:
        type: number
        description: number of CPUs per job
        minimum: 1
      memory:
        type: number
        description: memory per job in GB
        minimum: 1
      queue:
        type: string
        description: queue or partition name
      email:
        type: string
        description: email for job notifications

  output:
    type: object
    properties:
      keep_trajectories:
        type: boolean
        description: keep intermediate trajectory files
      compress_trajectories:
        type: boolean
        description: compress output trajectory files

  analysis:
    type: object
    properties:
      extract_energy:
        type: boolean
      calculate_rmsd:
        type: boolean
      calculate_rg:
        type: boolean

required:
  - sample_sheet
  - simulation
  - cluster
