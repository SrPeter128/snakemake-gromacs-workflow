$schema: "https://json-schema.org/draft/2020-12/schema"
description: entries for the sample sheet (MD simulations)
properties:
  sample:
    type: string
    description: sample name/identifier for the simulation
  protein_file:
    type: string
    description: path to input structure file (PDB, GRO, etc.)
  topology_file:
    type: string
    description: path to topology file (.top file)
  sim_type:
    type: string
    enum: ["aa", "cg"]
    description: simulation type (all-atom or coarse-grain)
  force_field:
    type: string
    description: force field for this simulation (optional, overrides config default)
    default: null
  replicate:
    type: integer
    description: replicate number for multiple runs of same system
    default: 1

required:
  - sample
  - protein_file
  - topology_file
  - sim_type

